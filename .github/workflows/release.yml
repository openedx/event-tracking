name: Release

on:
  push:
    branches: [master]

jobs:
  run_tests:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: run_tests
    if: github.ref_name == 'master'
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      version: ${{ steps.release.outputs.version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 0

    - run: git reset --hard ${{ github.sha }}

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    # python-semantic-release/python-semantic-release's GitHub Action builds
    # its own Docker image fresh on every run and pins gitpython~=3.0
    # (unbounded), so it always installs the latest 3.x release. GitPython
    # 3.1.60 (2026-08-25) removed `Actor.name_email_regex`, which PSR's own
    # config loader still reads unconditionally -- breaking every fresh build
    # of the action's image, regardless of which PSR version/SHA is pinned.
    # See python-semantic-release/python-semantic-release#1476 (open, no fix
    # released yet). Workaround: run the same PSR version ourselves via uv,
    # where we can pin gitpython below the break. Safe to revert to the
    # `uses: python-semantic-release/python-semantic-release@...` action once
    # upstream ships a fix.
    - name: Python Semantic Release
      id: release
      env:
        GH_TOKEN: ${{ secrets.OPENEDX_SEMANTIC_RELEASE_GITHUB_TOKEN }}
        GIT_COMMIT_AUTHOR: "github-actions <github-actions@github.com>"
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        uvx --with "gitpython<3.1.60" --from "python-semantic-release==10.6.1" \
          semantic-release -v version --no-changelog --no-vcs-release

    # This repo has immutable releases enabled, which freezes a release's
    # assets the moment it is published, so assets cannot be attached
    # afterwards. `gh release create` handles this by creating the release as
    # a draft, uploading the assets, and only then publishing it:
    # https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/immutable-releases
    - name: Publish | Create GitHub Release with Assets
      if: steps.release.outputs.released == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |
        printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release_notes.md"
        gh release create "$TAG" \
          --verify-tag \
          --title "$TAG" \
          --notes-file "$RUNNER_TEMP/release_notes.md" \
          dist/*

    - name: Upload dist artifacts
      if: steps.release.outputs.released == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish_to_pypi:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write

    steps:
    - name: Download dist artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
